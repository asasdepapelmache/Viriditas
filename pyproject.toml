[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viriditas"
version = "1.0.0"
description = "Fill a GitHub contribution graph with backdated commits, from 1969 to today."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["github", "contribution-graph", "git", "fast-import", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Source = "https://github.com/topics/viriditas"

[project.scripts]
viriditas = "viriditas.cli:main"

[tool.setuptools.packages.find]
include = ["viriditas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
